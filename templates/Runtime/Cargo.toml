[package]
name = "revengine_game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16", default-features = false, features = ["bevy_asset", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_gltf", "bevy_scene", "bevy_animation", "bevy_audio", "bevy_sprite", "bevy_ui", "png", "jpeg", "mp3", "wav", "vorbis", "tonemapping_luts", "x11", "multi_threaded"] }
bevy_rapier3d = { version = "0.30", features = ["dim3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
